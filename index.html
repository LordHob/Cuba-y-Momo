<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cartilla · Nuestras perras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Kalam:wght@400;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --kraft:#C6A472;
    --kraft-shadow:#9C7C4C;
    --paper:#F5EEDC;
    --paper-2:#EAE0C4;
    --ink:#2B2419;
    --ink-soft:#5B5137;
    --ink-blue:#33506C;
    --ink-red:#A13327;
    --ink-green:#4B6B44;
    --amber:#A97A24;
    --line: rgba(43,36,25,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at 15% -10%, rgba(255,255,255,0.12) 0%, transparent 55%),
      repeating-linear-gradient(0deg, rgba(0,0,0,0.015) 0 2px, transparent 2px 4px),
      var(--kraft);
    color:var(--ink);
    font-family:'Courier Prime', monospace;
    min-height:100vh;
    padding:48px 16px 80px;
  }
  .mono{ font-family:'Courier Prime', monospace; letter-spacing:0.01em; }
  .display{ font-family:'Caveat', cursive; }

  /* ---- Tabs (bookmark tabs sticking out of the notebook) ---- */
  .tabs{
    display:flex;
    justify-content:center;
    gap:14px;
    max-width:800px;
    margin:0 auto 0;
    padding:0 44px;
    position:relative;
    z-index:0;
  }
  .tab{
    font-family:'Kalam', cursive;
    font-weight:700;
    font-size:16px;
    background:var(--paper-2);
    color:var(--ink-soft);
    border:none;
    border-radius:8px 8px 0 0;
    padding:10px 24px 14px;
    cursor:pointer;
    position:relative;
    transition:transform .15s ease, background .15s ease, color .15s ease;
    opacity:.68;
    box-shadow:0 -1px 0 rgba(0,0,0,0.06) inset;
  }
  .tab:hover{ opacity:1; transform:translateY(-2px) rotate(-1deg); }
  .tab.active{
    background:var(--paper);
    color:var(--ink);
    opacity:1;
    transform:translateY(-2px);
    box-shadow:0 -3px 10px rgba(0,0,0,0.15);
  }

  /* ---- Notebook page ---- */
  .board{
    max-width:800px;
    margin:0 auto;
    background:var(--paper);
    border-radius:2px 10px 10px 2px;
    box-shadow:0 26px 50px -18px rgba(0,0,0,0.5), 0 2px 0 rgba(255,255,255,0.15) inset;
    position:relative;
    overflow:hidden;
    padding-left:34px;
    transform:rotate(-0.3deg);
  }
  .board::before{
    /* paper grain */
    content:"";
    position:absolute; inset:0;
    background-image:radial-gradient(rgba(43,36,25,0.045) 1px, transparent 1px);
    background-size:3px 3px;
    pointer-events:none;
  }
  .rings{
    position:absolute;
    left:0; top:0; bottom:0;
    width:34px;
    background:linear-gradient(90deg, rgba(0,0,0,0.06), transparent 60%);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-evenly;
    padding:20px 0;
    z-index:2;
  }
  .rings span{
    width:15px; height:15px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #dcd2ad, var(--kraft-shadow) 70%);
    box-shadow:inset 0 0 0 3px var(--paper), 0 1px 2px rgba(0,0,0,0.3);
    flex-shrink:0;
  }

  .clip{ display:none; }

  section.panel{ position:relative; z-index:1; }

  /* ---- Header ---- */
  .header{
    padding:34px 34px 26px 22px;
    border-bottom:1px dashed var(--line);
  }
  .photos{
    display:flex;
    gap:16px;
    margin-bottom:22px;
    padding-top:10px;
  }
  .photo{
    flex:1;
    aspect-ratio:4/3;
    background:#fff;
    border:1px solid rgba(43,36,25,0.15);
    box-shadow:0 6px 14px -4px rgba(0,0,0,0.3);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--ink-soft);
    font-size:11px;
    text-align:center;
    position:relative;
    overflow:visible;
    padding:8px;
  }
  .photo:nth-child(1){ transform:rotate(-3deg); }
  .photo:nth-child(2){ transform:rotate(1.5deg); }
  .photo:nth-child(3){ transform:rotate(-1deg); }
  .photo::before{
    /* washi tape */
    content:"";
    position:absolute;
    top:-11px; left:50%;
    width:54px; height:22px;
    margin-left:-27px;
    background:repeating-linear-gradient(-45deg, rgba(161,51,39,0.55) 0 6px, rgba(161,51,39,0.4) 6px 12px);
    opacity:0.72;
    transform:rotate(-4deg);
  }
  .photo:nth-child(2)::before{ transform:rotate(3deg); background:repeating-linear-gradient(-45deg, rgba(51,80,108,0.55) 0 6px, rgba(51,80,108,0.4) 6px 12px);}
  .photo svg{ opacity:0.3; width:38%; }
  .photo span{ position:absolute; bottom:8px; font-family:'Courier Prime',monospace; font-size:10px; letter-spacing:.04em;}
  .photo.has-img{ padding:0; }
  .photo.has-img img{ width:100%; height:100%; object-fit:cover; display:block; }

  .name-row{ display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
  h1.dogname{
    font-size:clamp(52px, 11vw, 78px);
    line-height:0.85;
    margin:0;
    font-weight:700;
    color:var(--ink);
    transform:rotate(-1.5deg);
    display:inline-block;
  }
  .breed-tag{
    font-family:'Kalam',cursive;
    font-weight:700;
    font-size:13px;
    color:var(--ink-red);
    border:1.5px solid var(--ink-red);
    padding:3px 10px 1px;
    border-radius:50%/50%;
    transform:rotate(3deg);
    opacity:0.85;
  }
  .subline{
    margin-top:6px;
    font-family:'Courier Prime',monospace;
    font-size:12.5px;
    color:var(--ink-soft);
    letter-spacing:.01em;
  }
  .subline b{ color:var(--ink); font-weight:700; }
  .subline .sep{ margin:0 10px; opacity:.4; }

  /* ---- Section label ---- */
  .section-inner{ padding:28px 34px 30px 22px; border-bottom:1px dashed var(--line); }
  .section-inner:last-child{ border-bottom:none; }
  .eyebrow{
    font-family:'Kalam',cursive;
    font-weight:700;
    font-size:19px;
    color:var(--ink-blue);
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:16px;
    transform:rotate(-0.6deg);
  }
  .eyebrow::after{
    content:"";
    flex:1;
    height:2px;
    background:repeating-linear-gradient(90deg, var(--line) 0 5px, transparent 5px 10px);
    margin-top:3px;
  }

  /* ---- Weight ---- */
  .weight-top{ display:flex; align-items:flex-end; gap:20px; margin-bottom:18px; }
  .weight-kg{ font-family:'Caveat',cursive; font-size:64px; font-weight:700; line-height:0.8; color:var(--ink); }
  .weight-kg small{ font-family:'Courier Prime'; font-size:15px; font-weight:700; color:var(--ink-soft); }
  .weight-meta{ font-family:'Courier Prime',monospace; font-size:11.5px; color:var(--ink-soft); padding-bottom:10px;}
  .chart-wrap{ width:100%; }
  .chart-wrap svg{ width:100%; height:auto; display:block; }

  /* ---- Treatments ---- */
  .treat{
    display:flex;
    gap:14px;
    padding:15px 0;
    border-top:1px dashed var(--line);
  }
  .treat:first-of-type{ border-top:none; padding-top:0; }
  .treat-icon{
    width:36px; height:36px; flex-shrink:0;
    border-radius:50%;
    background:var(--paper-2);
    border:1.5px solid rgba(43,36,25,0.15);
    display:flex; align-items:center; justify-content:center;
  }
  .treat-icon svg{ width:18px; height:18px; stroke:var(--ink-blue); }
  .treat-body{ flex:1; min-width:0; }
  .treat-row1{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .treat-name{ font-weight:700; font-size:14.5px; }
  .pill{
    font-family:'Kalam',cursive;
    font-weight:700;
    font-size:12px;
    text-transform:uppercase;
    padding:2px 12px 3px;
    border-radius:50%/50%;
    white-space:nowrap;
    border:2px solid;
    transform:rotate(-3deg);
  }
  .pill.ok{ color:var(--ink-green); border-color:var(--ink-green); }
  .pill.soon{ color:var(--amber); border-color:var(--amber); }
  .pill.late{ color:var(--ink-red); border-color:var(--ink-red); }
  .pill.track{ color:var(--ink-blue); border-color:var(--ink-blue); }
  .treat-brand{ font-family:'Courier Prime',monospace; font-size:11px; color:var(--ink-soft); font-style:italic; margin-top:1px; }
  .hist-note{ display:block; font-style:italic; opacity:0.8; }
  .treat-dates{ margin-top:5px; font-family:'Courier Prime',monospace; font-size:12px; color:var(--ink-soft); }
  .treat-dates b{ color:var(--ink); font-weight:700;}

  .stamp{
    display:inline-flex;
    align-items:center;
    gap:5px;
  }
  .stamp svg{ width:14px; height:14px; }

  .hist-toggle{
    margin-top:8px;
    font-family:'Courier Prime',monospace;
    font-size:11px;
    color:var(--ink-blue);
    cursor:pointer;
    background:none;
    border:none;
    padding:0;
    display:flex;
    align-items:center;
    gap:5px;
  }
  .hist-toggle svg{ width:9px; height:9px; transition:transform .15s ease; }
  .hist-toggle.open svg{ transform:rotate(90deg); }
  .hist-list{
    list-style:none;
    margin:10px 0 0;
    padding:0;
    display:none;
    border-left:2px dashed var(--paper-2);
    padding-left:12px;
  }
  .hist-list.open{ display:block; }
  .hist-list li{
    font-family:'Courier Prime',monospace;
    font-size:11.5px;
    color:var(--ink-soft);
    padding:3px 0;
  }

  /* ---- Feeding timeline ---- */
  .feed-line{ position:relative; padding-left:26px; }
  .feed-line::before{
    content:"";
    position:absolute; left:6px; top:8px; bottom:8px;
    width:1.5px;
    border-left:1.5px dashed var(--paper-2);
  }
  .feed-item{ position:relative; padding-bottom:22px; }
  .feed-item:last-child{ padding-bottom:0; }
  .feed-dot{
    position:absolute; left:-26px; top:1px;
    width:16px; height:16px;
  }
  .feed-dot svg{ width:100%; height:100%; }
  .feed-name{ font-weight:700; font-size:14.5px; }
  .feed-item.current .feed-name::after{
    content:"actual";
    font-family:'Kalam',cursive;
    font-weight:700;
    font-size:11px;
    color:var(--ink-green);
    border:1.5px solid var(--ink-green);
    padding:1px 8px 0;
    border-radius:50%/50%;
    margin-left:9px;
    vertical-align:middle;
    transform:rotate(-2deg);
    display:inline-block;
  }
  .feed-dates{ font-family:'Courier Prime',monospace; font-size:11.5px; color:var(--ink-soft); margin-top:2px;}

  .placeholder-note{
    max-width:800px;
    margin:20px auto 0;
    text-align:center;
    font-family:'Kalam',cursive;
    font-size:13.5px;
    color:rgba(43,36,25,0.55);
  }

  @media (max-width:560px){
    .header{ padding-left:16px; padding-right:22px; }
    .section-inner{ padding-left:16px; padding-right:22px; }
    .board{ padding-left:26px; }
    .rings{ width:26px; }
    .weight-kg{ font-size:48px; }
    h1.dogname{ font-size:52px; }
  }
</style>
</head>

  <div class="clip">

      <rect x="6" y="0" width="78" height="14" rx="7" fill="#8b8378"/>

      <circle cx="45" cy="15" r="2.6" fill="#6f6858"/>
    </svg>
  </div>

  <div class="board">
    <div class="rings" id="rings"></div>
    <div id="content"></div>
  </div>

  <p class="placeholder-note">Maqueta con datos de ejemplo — pásame fotos y datos reales y lo dejamos a punto ✎</p>

function fmt(d){
  const dt = new Date(d);
  return dt.toLocaleDateString('es-ES', {day:'2-digit', month:'short', year:'numeric'}).replace('.','');
}
function addDays(dateStr, days){
  const dt = new Date(dateStr);
  dt.setDate(dt.getDate()+days);
  return dt;
}
function ageString(birthdate){
  const b = new Date(birthdate);
  let years = TODAY.getFullYear()-b.getFullYear();
  let months = TODAY.getMonth()-b.getMonth();
  if(months<0){ years--; months+=12; }
  return years + (years===1?' año':' años') + (months>0 ? ', '+months+(months===1?' mes':' meses') : '');
}

function entryDate(e){ return typeof e === 'string' ? e : e.date; }
function entryNote(e){ return typeof e === 'string' ? null : (e.note || null); }

function treatmentStatus(t){
  const last = entryDate(t.history[t.history.length-1]);
  if(!t.freqDays){
    return {last, next:null, daysLeft:null, status:'track'};
  }
  const next = addDays(last, t.freqDays);
  const daysLeft = Math.round((next - TODAY)/86400000);
  let status = 'ok';
  if(daysLeft < 0) status = 'late';
  else if(daysLeft <= 14) status = 'soon';
  return {last, next, daysLeft, status};
}

function weightChartSVG(history){
  const W = 640, H = 150, pad = { l:34, r:14, t:14, b:26 };
  const kgs = history.map(h=>h.kg);
  const min = Math.min(...kgs) - 0.6, max = Math.max(...kgs) + 0.6;
  const x = i => pad.l + (i/(history.length-1)) * (W-pad.l-pad.r);
  const y = v => H-pad.b - ((v-min)/(max-min)) * (H-pad.t-pad.b);

  const points = history.map((h,i)=>`${x(i)},${y(h.kg)}`).join(' ');
  const areaPoints = `${x(0)},${H-pad.b} ` + points + ` ${x(history.length-1)},${H-pad.b}`;

  let gridLines = '';
  const steps = 3;
  for(let s=0; s<=steps; s++){
    const v = min + (max-min)*s/steps;
    const yy = y(v);
    gridLines += `<line x1="${pad.l}" y1="${yy}" x2="${W-pad.r}" y2="${yy}" stroke="rgba(43,36,25,0.1)" stroke-width="1" stroke-dasharray="1 3"/>`;
    gridLines += `<text x="${pad.l-8}" y="${yy+3}" text-anchor="end" font-family="Courier Prime" font-size="9.5" fill="#5B5137">${v.toFixed(1)}</text>`;
  }

  let labels = '';
  const labelStep = Math.ceil(history.length / 7);
  history.forEach((h,i)=>{
    if(i % labelStep !== 0 && i !== history.length-1) return;
    labels += `<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-family="Courier Prime" font-size="9" fill="#5B5137">${new Date(h.date).toLocaleDateString('es-ES',{month:'short',year:'2-digit'})}</text>`;
  });

  let dots = '';
  history.forEach((h,i)=>{
    dots += `<circle cx="${x(i)}" cy="${y(h.kg)}" r="3.6" fill="#F5EEDC" stroke="#A13327" stroke-width="2"/>`;
  });

  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
    ${gridLines}
    <polyline points="${points}" fill="none" stroke="#33506C" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="1 0"/>
    ${dots}
    ${labels}
  </svg>`;
}

function pawSVG(){
  return `<svg viewBox="0 0 24 24" fill="#33506C"><ellipse cx="12" cy="15" rx="6.2" ry="5.2"/><ellipse cx="4.5" cy="8.5" rx="2.2" ry="2.8" transform="rotate(-15 4.5 8.5)"/><ellipse cx="9.8" cy="4.8" rx="2.1" ry="2.7" transform="rotate(-5 9.8 4.8)"/><ellipse cx="15.2" cy="4.6" rx="2.1" ry="2.7" transform="rotate(6 15.2 4.6)"/><ellipse cx="19.5" cy="8.3" rx="2.2" ry="2.8" transform="rotate(16 19.5 8.3)"/></svg>`;
}

function dogSVGPlaceholder(){
  return `<svg viewBox="0 0 64 64" fill="none" stroke="#57534A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 44c0-9 5-16 12-16s12 7 12 16"/>
    <circle cx="26" cy="26" r="2" fill="#57534A" stroke="none"/>
    <circle cx="38" cy="26" r="2" fill="#57534A" stroke="none"/>
    <path d="M16 20c-2-5-1-9 2-10 3-1 5 2 5 6M48 20c2-5 1-9-2-10-3-1-5 2-5 6"/>
    <path d="M32 34v6M26 46l-3 6M38 46l3 6"/>
  </svg>`;
}

function stampSVG(){
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9"/></svg>`;
}

function render(key){
  const d = DOGS[key];
  const board = document.getElementById('content');

  const photosHTML = (d.photos && d.photos.length ? d.photos : [null,null,null])
    .map(src => src
      ? `<div class="photo has-img"><img src="${src}" alt="${d.name}"></div>`
      : `<div class="photo">${dogSVGPlaceholder()}<span>foto pendiente</span></div>`
    ).join('');

  const treatHTML = Object.keys(d.treatments).map(k=>{
    const t = d.treatments[k];
    const s = treatmentStatus(t);
    const pillLabel = s.status==='late' ? 'vencido' : s.status==='soon' ? 'próximo' : s.status==='track' ? 'seguimiento' : 'al día';
    const histList = t.history.slice().reverse().map(h=>{
      const note = entryNote(h);
      return `<li>${fmt(entryDate(h))}${note ? `<span class="hist-note">${note}</span>` : ''}</li>`;
    }).join('');
    const uid = key+'_'+k;
    const nextLine = t.freqDays
      ? `&nbsp;·&nbsp;<span class="stamp">${stampSVG()} Próximo: <b>${fmt(s.next.toISOString().slice(0,10))}</b></span>`
      : `&nbsp;·&nbsp;<span>sin pauta fija, según necesidad</span>`;
    return `
    <div class="treat">
      <div class="treat-icon">${ICONS[k]}</div>
      <div class="treat-body">
        <div class="treat-row1">
          <div>
            <div class="treat-name">${t.label}</div>
            ${t.brand ? `<div class="treat-brand">${t.brand}</div>` : ''}
          </div>
          <span class="pill ${s.status}">${pillLabel}</span>
        </div>
        <div class="treat-dates">
          Último: <b>${fmt(s.last)}</b>${nextLine}
        </div>
        <button class="hist-toggle" onclick="toggleHist('${uid}', this)">
          <svg viewBox="0 0 6 10" fill="currentColor"><path d="M0 0l6 5-6 5z"/></svg>
          histórico (${t.history.length})
        </button>
        <ul class="hist-list" id="hist_${uid}">${histList}</ul>
      </div>
    </div>`;
  }).join('');

  const feedHTML = d.feeding.map(f=>{
    const isCurrent = f.end===null;
    const dates = isCurrent ? `desde ${fmt(f.start)}` : `${fmt(f.start)} — ${fmt(f.end)}`;
    return `
    <div class="feed-item ${isCurrent?'current':''}">
      <div class="feed-dot">${pawSVG()}</div>
      <div class="feed-name">${f.food}</div>
      <div class="feed-dates">${dates}</div>
    </div>`;
  }).join('');

  const lastWeight = d.weightHistory[d.weightHistory.length-1];

  board.innerHTML = `
    <section class="panel header">
      <div class="photos">${photosHTML}</div>
      <div class="name-row">
        <h1 class="dogname display">${d.name}</h1>
        ${d.breed ? `<span class="breed-tag">${d.breed}</span>` : ''}
      </div>
      <div class="subline">
        <b>${ageString(d.birthdate)}</b> · nace el ${fmt(d.birthdate)}
        <span class="sep">·</span>
        también responde a <b>${d.nicknames.join(', ')}</b>
      </div>
    </section>

    <section class="panel section-inner">
      <div class="eyebrow">Peso</div>
      <div class="weight-top">
        <div class="weight-kg display">${lastWeight.kg}<small>kg</small></div>
        <div class="weight-meta">última pesada · ${fmt(lastWeight.date)}</div>
      </div>
      <div class="chart-wrap">${weightChartSVG(d.weightHistory)}</div>
    </section>

    <section class="panel section-inner">
      <div class="eyebrow">Tratamientos veterinarios</div>
      ${treatHTML}
    </section>

    <section class="panel section-inner">
      <div class="eyebrow">Alimentación</div>
      <div class="feed-line">${feedHTML}</div>
    </section>
  `;
}

function toggleHist(uid, btn){
  const el = document.getElementById('hist_'+uid);
  el.classList.toggle('open');
  btn.classList.toggle('open');
}

function renderTabs(active){
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = Object.keys(DOGS).map(k=>
    `<button class="tab ${k===active?'active':''}" onclick="switchDog('${k}')">${DOGS[k].name}</button>`
  ).join('');
}

function switchDog(key){
  renderTabs(key);
  render(key);
}

document.getElementById('rings').innerHTML = Array(9).fill('<span></span>').join('');
switchDog('cuba');
</script>
</body>
</html>
